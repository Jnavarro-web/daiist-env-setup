name: Verify Environment Setup

on:
  pull_request:
    branches: [main]
    paths:
      - "submissions/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run autograder
        run: uv run pytest tests/test_exercise.py -v
